version: '3.8'

services:
  backend:
    build: ./backend
    container_name: msikaai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - msikaai-network

  nginx:
    image: nginx:alpine
    container_name: msikaai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - msikaai-network

networks:
  msikaai-network:
    driver: bridge